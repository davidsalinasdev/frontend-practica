<div class="row">
    <div class="fondo-header col-12">
        <h2 class="text-center semanario-titulo text-uppercase">Semanario digital</h2>
    </div>
</div>


<div class="row mt-4">
    <div class="col-3"></div>
    <div class="col-6 d-flex justify-content-between">
        <span class="font-weight-normal"><span class="font-weight-normal text-info">Edición:</span> {{
            this.libroImagenes[0]?.edicion
            }}</span>
        <span class="font-weight-normal"><span class="font-weight-normal text-info">Fecha de publicación:</span> {{
            this.libroImagenes[0]?.fecha_publicacion
            }}</span>
    </div>
    <div class="col-3"></div>
</div>

<hr>

<div class="row">

    <div class="col-12 flitbook-contenedor">
        <!-- flipBook -->
        <button id="prev-btn">
            <i class="fas fa-chevron-left"></i> <!-- Icono para menor que -->
        </button>


        <div id="book" class="book">

            <!-- Iteramos sobre libroImagenes -->
            <!-- Iteramos sobre libroImagenes para generar papers dinámicos -->
            <div *ngFor="let imagenPair of libroImagenesPairs; let i = index" [id]="'p' + (i + 1)" class="paper">

                <!-- Front Side (primera imagen del par) -->
                <div class="front">
                    <div [id]="'f' + (i + 1)" class="front-content">
                        <img class="cover-img" [src]="imagenPair[0]?.fullUrl" [alt]="'Imagen ' + (2 * i + 1)"
                            *ngIf="imagenPair[0]">
                    </div>
                </div>

                <!-- Back Side (segunda imagen del par, si existe) -->
                <div class="back">
                    <div [id]="'b' + (i + 1)" class="back-content">
                        <img class="cover-img" [src]="imagenPair[1]?.fullUrl" [alt]="'Imagen ' + (2 * i + 2)"
                            *ngIf="imagenPair[1]">
                    </div>
                </div>

            </div>

        </div>

        <button id="next-btn">
            <i class="fas fa-chevron-right"></i> <!-- Icono para mayor que -->
        </button>
        <!-- FIN FlipBook -->
    </div>

</div>

<!-- Cards  de eleccion -->
<div class="col-12" style="margin-top: 4.5rem;">
    <h3 class="text-center text-uppercase">Gobernación al Día</h3>
</div>
<section class="gallery mt-3">
    <!-- Cada elemento multimedia -->
    <article class="media-item"
        *ngFor="let doc of documentos | paginate: { itemsPerPage: this.limite, currentPage: this.page, totalItems: this.totalItems }">
        <!-- imagen -->
        <img [src]="this.urlPortada +'/'+ doc.img_semanarios[0]?.imagen" alt="semanarios">

        <div class="media-info">
            <h2 class="text-left">{{ doc.edicion }}</h2>
            <p><span class="font-normal">Fecha de publicación:</span> {{ doc.fecha_publicacion }}</p>
            <a class="view-more text-white" (click)="verSemanario(doc)" style="cursor: pointer;">Ver semanario</a>
        </div>

    </article>

</section>

<!-- Paginación con ngx-pagination -->
<div class=" pagination">
    <!-- Control de paginación -->
    <pagination-controls previousLabel="Anterior" nextLabel="Siguiente" (pageChange)="this.pageChanged($event)">
    </pagination-controls>
</div>

<app-footer-gadc></app-footer-gadc>
