<footer class="footer-custom">
  <div class="footer-content">
    <div class="contact-info">
      <h3>Información de Contacto</h3>
      <p>{{ this.despacho?.despacho.direccion }}</p>
      <p>Telefonos: {{ this.despacho?.despacho.telefonos }}</p>
      <p class="email-gober">Email: {{ this.despacho?.despacho.email }}</p>
    </div>
    <div class="logo">
      <img class="img-fluid" src="./../../../../../assets/img/logo3.png"
        alt="Logo Gobierno Autónomo Departamental de Cochabamba" />
      <!-- <img src="" alt="logo" /> -->
    </div>
    <div class="social-media">
      <h3>Canales de Comunicación</h3>
      <a href="https://x.com/i/flow/login?redirect_after_login=%2FGobernacionCbba" target="_blank"><i
          class="bi bi-twitter-x"></i></a>
      <a href="https://www.facebook.com/GobernacionDeCochabamba" target="_blank"><i class="bi bi-facebook"></i></a>
      <a href="https://www.tiktok.com/@gobernaciondecochabamba" target="_blank"><i class="bi bi-tiktok"></i></a>
      <a href="https://www.youtube.com/@gobernaciondecochabamba8326" target="_blank"><i class="bi bi-youtube"></i></a>
      <a href="https://www.instagram.com/gobernaciondecochabamba/" target="_blank"><i class="bi bi-instagram"></i></a>
      <a [routerLink]="['/web/gobernaciontv']"><i class="bi bi-broadcast"></i></a>
    </div>
  </div>
  <div class="footer-bottom">
    <p class="footer-bottom--text">&copy; {{ this.years }}, Gobierno Autónomo Departamental de Cochabamba</p>
  </div>
</footer>
