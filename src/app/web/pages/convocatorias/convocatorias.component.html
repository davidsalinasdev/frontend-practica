<div class="row">
    <div class="fondo-header col-12">
        <h2 class="text-center leyes_decretos">AUDITORIAS</h2>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-12 col-lg-6 d-flex pb-4 pt-5">
        <input type="text" class="form-control" [(ngModel)]="this.search">
        <button type="button" class="btn btn-info ml-lg-2" (click)="buscar()"><i class="fa fa-search"></i>
            BUSCAR</button>
    </div>
</div>

<div class="container">
    <div class="grid-card"
        *ngFor="let doc of documentos | paginate: { itemsPerPage: this.limite, currentPage: this.page, totalItems: this.totalItems }">
        <div class="card auditoria">
            <div class="row justify-content-center">
                <div class="image-container">
                    <svg class="MuiSvgIcon-root jss146 jss151" focusable="false" viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M20 2H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-8.5 7.5c0 .83-.67 1.5-1.5 1.5H9v1.25c0 .41-.34.75-.75.75s-.75-.34-.75-.75V8c0-.55.45-1 1-1H10c.83 0 1.5.67 1.5 1.5v1zm5 2c0 .83-.67 1.5-1.5 1.5h-2c-.28 0-.5-.22-.5-.5v-5c0-.28.22-.5.5-.5h2c.83 0 1.5.67 1.5 1.5v3zm4-3.75c0 .41-.34.75-.75.75H19v1h.75c.41 0 .75.34.75.75s-.34.75-.75.75H19v1.25c0 .41-.34.75-.75.75s-.75-.34-.75-.75V8c0-.55.45-1 1-1h1.25c.41 0 .75.34.75.75zM9 9.5h1v-1H9v1zM3 6c-.55 0-1 .45-1 1v13c0 1.1.9 2 2 2h13c.55 0 1-.45 1-1s-.45-1-1-1H5c-.55 0-1-.45-1-1V7c0-.55-.45-1-1-1zm11 5.5h1v-3h-1v3z">
                        </path>
                    </svg>
                </div>
            </div>
            <h2 class="font-bold">{{ doc.titulo }}</h2>
            <p class="font-weight-normal">{{ doc.resumen }}"</p>
            <a [href]="doc.archivo">ABRIR</a>
        </div>
    </div>
</div>

<!-- Paginación con ngx-pagination -->
<div class="pagination">
    <!-- Control de paginación -->
    <pagination-controls previousLabel="Anterior" nextLabel="Siguiente" (pageChange)="this.pageChanged($event)">
    </pagination-controls>
</div>

<app-footer-gadc [ngClass]="{'footer-auditoria': this.opcionAuditoria}"></app-footer-gadc>
