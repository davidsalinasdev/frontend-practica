<div class="row">
  <div class="col-12">
    <h2 class="text-left pilares-gestion__titulo">Pilares de gestión</h2>
  </div>
</div>

<!-- Carrusel -->
<div class="col-12 mt-3">
  <div id="banerPilares" class="carousel slide" data-ride="carousel">
    <div class="carousel-inner" role="listbox">
      <div *ngFor="let itemPilares of pilaresDivididos; let i = index" class="carousel-item" [class.active]="i === 0">

        <div class="grid">

          <div *ngFor="let item of this.itemPilares" class="card">

            <img src="{{ item.imagen }}" alt="Imagen 1">
            <div class="p-3">
              <h4 class="text-dark font-weight-normal">{{ item.titulo }}</h4>
            </div>
            <div class="row pb-2">
              <p class="col-12 mb-2 font-weight-normal text-dark text-center">{{ item.periodo }}</p>
              <div class="col-12 text-center mb-2 mt-2">
                <a class="text-white btn-bajar-archivo" (click)="abrirArchivo(item.archivo)">ABRIR ARCHIVO</a>
              </div>
            </div>

          </div>

        </div>
      </div>
    </div>


    <a class="carousel-control-prev" href="#banerPilares" role="button" data-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="sr-only">Previous</span>
    </a>
    <a class="carousel-control-next" href="#banerPilares" role="button" data-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="sr-only">Next</span>
    </a>

  </div>
</div>
