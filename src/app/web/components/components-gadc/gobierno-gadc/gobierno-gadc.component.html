<div class="row justify-content-center">
  <div class="col-12">
    <a [routerLink]="[ '/web/gobierno' ]">
      <h2 class="text-left gobierno__titulo">Gobierno</h2>
    </a>
  </div>

  <div class="row">
    <div class="col-12 mt-2">
      <div class="secretarias-container">
        <ng-container *ngFor="let secretaria of this.listSecretarias; let i = index">
          <a [routerLink]="[ '/web/secretarias', secretaria.undId ]">
            <div class="secretaria" [ngStyle]="{'z-index': (1000-i)}">
              <img [src]="secretaria.imagenIcono" alt="{{secretaria.nombre}}">
              <span class="tooltip-text">
                {{ secretaria.nombre }}
              </span>
            </div>
          </a>
        </ng-container>

      </div>
    </div>
  </div>
</div>
