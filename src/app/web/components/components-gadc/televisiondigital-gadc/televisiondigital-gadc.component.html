<div class="row">
  <div class="d-flex align-items-center">
    <h2 class="text-left television__titulo">Programación Gobernación TV</h2>
    <!-- <span class="live-indicator ml-2">
      <span class="live-circle"></span>
      EN DIRECTO
    </span> -->
  </div>

  <!-- Tv en vivo -->
  <div class="col-12 mt-4">
    <div class="container-tv">
      <div class="program">

        <div class="video-player">
          <!-- Iframe para YouTube en vivo -->
          <iframe width="100%" height="400" [src]="urlGlobal" frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>
        </div>

        <div class="program-details">
          <h4>{{ this.itemData?.programa }}</h4>
          <!-- <p class="time">{{ this.itemData?.horario }}</p> -->
          <p class="description">{{ this.itemData?.descripcion }}</p>

          <!-- <a class="watch-button" [routerLink]="[ '/web/gobernaciontv']">Gobernación TV</a> -->

        </div>

      </div>
    </div>
  </div>
</div>
